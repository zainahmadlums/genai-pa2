# Persona track: TRL DPOTrainer + PEFT LoRA. Rationale for each choice: docs/DESIGN_NOTES.md.
run_name: persona_lora
model_name: HuggingFaceTB/SmolLM2-360M-Instruct
data_file: data/persona_lora/ramsay_style_preferences.json
eval_prompts_file: eval_sets/persona_eval_prompts.json
output_dir: outputs/persona_lora

val_size: 20                # 200 train / 20 validation pairs, seed-shuffled
seed: 42
beta: 0.1
max_length: 512

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.0
max_grad_norm: 1.0
per_device_train_batch_size: 4
gradient_accumulation_steps: 2   # effective batch size 8 -> 25 optimizer steps per epoch
num_train_epochs: 3              # 75 optimizer steps
per_device_eval_batch_size: 8
logging_steps: 5
eval_steps: 10
select_best: true                # keep the adapter with the lowest validation DPO loss
