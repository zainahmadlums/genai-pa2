# Supervised fine-tuning (custom loop). Guide values from the assignment manual, section 9.2.
run_name: sft
model_name: Qwen/Qwen2.5-0.5B
train_file: outputs/data/sft_train.jsonl
val_file: outputs/data/sft_val.jsonl
output_dir: outputs/sft

template: alpaca            # "### Instruction:\n{instruction}\n\n### Response:\n" (see alignment/prompt_format.py)
max_length: 512             # context length; EOS is appended before truncation
max_prompt_length: 256      # safety cap; data preparation already filters longer prompts
reduction: token_mean       # mean NLL over all response tokens in a micro-batch

train_size: 30000
val_size: 1000
epochs: 1
batch_size: 2               # per-device batch size
grad_accum_steps: 16        # effective batch size 32
learning_rate: 2.0e-5       # peak
schedule: cosine
warmup_ratio: 0.03
weight_decay: 0.1           # applied to weight matrices only (not biases / norm weights)
max_grad_norm: 1.0
optimizer: adamw
precision: fp16             # fp16 autocast, fp32 weights, GradScaler
seed: 42
device: cuda:0

eval_at_start: true
eval_every_steps: 100       # optimizer steps (938 in total for 30k rows)
eval_batch_size: 2          # rows per validation batch; same as batch_size, so a validation batch never needs more
                            # GPU memory than a training micro-batch (8 ran out of memory on a T4). The validation
                            # metrics do not depend on this value.
log_every_steps: 10
resume_every_steps: 0       # mid-run resume state (about 6 GB per save) is off by default. On Kaggle enable it with
                            #   --override resume_every_steps=250 resume_dir=/kaggle/temp/resume/sft
                            # so the state stays outside the 20 GB /kaggle/working quota.
